<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 548" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0307"/>
      <stop offset="35%" stop-color="#040F26"/>
      <stop offset="70%" stop-color="#081E47"/>
      <stop offset="100%" stop-color="#050C1F"/>
    </linearGradient>

    <!-- Flight Curve Glow -->
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF6B00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF0044" stop-opacity="1"/>
    </linearGradient>

    <!-- Jet Body Gradient -->
    <linearGradient id="jetRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A4D"/>
      <stop offset="40%" stop-color="#D90429"/>
      <stop offset="100%" stop-color="#7A0014"/>
    </linearGradient>
    <linearGradient id="jetWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#A40019"/>
    </linearGradient>
    <linearGradient id="cockpit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#08478E"/>
    </linearGradient>

    <!-- Thruster Flame -->
    <linearGradient id="flameGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FFDD00"/>
      <stop offset="60%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF0044" stop-opacity="0"/>
    </linearGradient>

    <!-- Text Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="flameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="388" height="548" fill="url(#bgGrad)"/>

  <!-- Radar / Grid Lines -->
  <g opacity="0.15" stroke="#3B82F6" stroke-width="1">
    <line x1="0" y1="100" x2="388" y2="100" />
    <line x1="0" y1="200" x2="388" y2="200" />
    <line x1="0" y1="300" x2="388" y2="300" />
    <line x1="0" y1="400" x2="388" y2="400" />
    <line x1="80" y1="0" x2="80" y2="548" />
    <line x1="180" y1="0" x2="180" y2="548" />
    <line x1="280" y1="0" x2="280" y2="548" />
  </g>

  <!-- Glowing Sun / Planetary Glow in Background -->
  <circle cx="280" cy="180" r="140" fill="#FF6B00" opacity="0.18" filter="url(#glow)"/>
  <circle cx="280" cy="180" r="70" fill="#FFC700" opacity="0.12" filter="url(#glow)"/>

  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="45" cy="80" r="1.5"/>
    <circle cx="120" cy="45" r="2"/>
    <circle cx="210" cy="95" r="1"/>
    <circle cx="340" cy="70" r="1.8"/>
    <circle cx="90" cy="180" r="1.2"/>
    <circle cx="60" cy="310" r="2"/>
    <circle cx="140" cy="270" r="1.5"/>
  </g>

  <!-- Climbing Flight Curve -->
  <path d="M 20 480 Q 150 460 210 320 T 310 170" fill="none" stroke="url(#trailGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 20 480 Q 150 460 210 320 T 310 170" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Thruster Fire Cone -->
  <g filter="url(#flameGlow)">
    <polygon points="275,200 230,235 255,210" fill="url(#flameGrad)" />
    <polygon points="270,205 210,250 250,215" fill="url(#flameGrad)" opacity="0.8" />
  </g>

  <!-- The Aviator Jet Plane -->
  <g transform="translate(190, 85) rotate(-28)">
    <!-- Shadow underneath -->
    <ellipse cx="60" cy="75" rx="50" ry="12" fill="#000000" opacity="0.4" filter="url(#glow)"/>

    <!-- Left Wing -->
    <polygon points="30,55 -15,75 5,45" fill="url(#jetWing)" />

    <!-- Fuselage Body -->
    <path d="M 125 45 Q 90 28 30 35 L 5 45 Q 3 48 5 52 L 30 58 Q 90 62 125 45 Z" fill="url(#jetRed)" />

    <!-- Fuselage Highlight Stripe -->
    <path d="M 120 44 Q 85 33 35 38 L 40 42 Q 85 37 115 45 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Cockpit Canopy Glass -->
    <path d="M 95 38 Q 80 32 65 37 L 70 42 Q 82 39 92 41 Z" fill="url(#cockpit)" stroke="#00D2FF" stroke-width="1"/>

    <!-- Right Wing (Main) -->
    <polygon points="65,48 20,110 50,115 95,50" fill="url(#jetWing)" stroke="#FF6B00" stroke-width="1.5"/>
    <polygon points="63,52 30,105 45,108 90,53" fill="#FF4D6D" opacity="0.5"/>

    <!-- Tail Fin (Vertical Stabilizer) -->
    <polygon points="12,42 -5,8 8,6 28,40" fill="url(#jetWing)" />
    <polygon points="10,40 -2,12 6,10 24,38" fill="#FFC700" opacity="0.7"/>

    <!-- Propeller Spinner / Nose Cone -->
    <ellipse cx="125" cy="45" rx="4" ry="7" fill="#FFC700" />
    <ellipse cx="126" cy="45" rx="2" ry="4" fill="#FFFFFF" />
  </g>

  <!-- Speed Motion Streaks -->
  <g stroke="#FF6B00" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="200" y1="230" x2="160" y2="255" />
    <line x1="240" y1="210" x2="180" y2="245" />
    <line x1="160" y1="280" x2="110" y2="310" />
  </g>

  <!-- Top Badges Overlay -->
  <g transform="translate(20, 24)">
    <rect width="82" height="26" rx="6" fill="#D90429" />
    <text x="41" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">CRASH</text>
  </g>

  <g transform="translate(280, 24)">
    <rect width="88" height="26" rx="6" fill="#FFC700" />
    <text x="44" y="17" fill="#040F26" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">100X+</text>
  </g>

  <!-- Bottom Gradient Vignette for Text Contrast -->
  <rect y="360" width="388" height="188" fill="url(#bgGrad)" opacity="0.95"/>
  <rect y="380" width="388" height="168" fill="url(#bgGrad)"/>

  <!-- Big Brand Title "AVIATOR" -->
  <g transform="translate(194, 460)">
    <!-- Drop Shadow -->
    <text x="0" y="4" fill="#000000" font-family="system-ui, sans-serif" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3" opacity="0.8">AVIATOR</text>
    <!-- Main Glowing Red Text -->
    <text x="0" y="0" fill="#FF2A4D" font-family="system-ui, sans-serif" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3" filter="url(#glow)">AVIATOR</text>
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3">AVIATOR</text>
  </g>

  <!-- Tagline / Subtitle -->
  <text x="194" y="495" fill="#FFC700" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2">NEXT-GEN MULTIPLIER</text>
  <text x="194" y="515" fill="#8EA8C7" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">PROVABLY FAIR • 99% RTP</text>
</svg>
