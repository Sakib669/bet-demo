<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 548" width="100%" height="100%">
  <defs>
    <linearGradient id="coinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="40%" stop-color="#08478E"/>
      <stop offset="80%" stop-color="#051738"/>
      <stop offset="100%" stop-color="#030A1C"/>
    </linearGradient>

    <!-- 3D Gold Coin Gradient -->
    <radialGradient id="coinGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#D49B00"/>
      <stop offset="100%" stop-color="#8A5C00"/>
    </radialGradient>

    <linearGradient id="coinRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#996300"/>
    </linearGradient>

    <filter id="cGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="388" height="548" fill="url(#coinBg)"/>

  <!-- Golden Particle Aura -->
  <circle cx="194" cy="230" r="140" fill="#FFC700" opacity="0.2" filter="url(#cGlow)"/>
  <circle cx="194" cy="230" r="80" fill="#FF6B00" opacity="0.15" filter="url(#cGlow)"/>

  <!-- Floating Sparkles -->
  <g fill="#FFD700" opacity="0.7">
    <polygon points="80,140 85,150 95,155 85,160 80,170 75,160 65,155 75,150" />
    <polygon points="310,180 314,188 322,192 314,196 310,204 306,196 298,192 306,188" />
    <polygon points="120,310 123,316 129,319 123,322 120,328 117,322 111,319 117,316" />
    <polygon points="280,310 284,318 292,322 284,326 280,334 276,326 268,322 276,318" />
  </g>

  <!-- Large 3D Gold Coin (Slightly tilted) -->
  <g transform="translate(194, 230) rotate(-8)">
    <!-- Coin Edge Shadow for 3D thickness -->
    <ellipse cx="6" cy="6" rx="86" ry="86" fill="#593B00" opacity="0.6"/>
    <ellipse cx="4" cy="4" rx="84" ry="84" fill="url(#coinRim)"/>

    <!-- Main Coin Face -->
    <circle cx="0" cy="0" r="82" fill="url(#coinGold)" stroke="#FFF3B0" stroke-width="2"/>

    <!-- Inner Beaded Ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#D49B00" stroke-width="2" stroke-dasharray="3,4"/>

    <!-- Embossed 5-Point Crown Star -->
    <polygon points="0,-42 12,-16 40,-16 18,2 26,30 0,14 -26,30 -18,2 -40,-16 -12,-16" fill="#FFF3B0" stroke="#B27B00" stroke-width="2" filter="url(#cGlow)"/>

    <!-- Text Emboss "HEADS" & "1.98X" -->
    <text x="0" y="48" fill="#593B00" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="3">VERIFIED FAIR</text>

    <!-- Gloss Specular Reflection -->
    <ellipse cx="-25" cy="-30" rx="35" ry="18" fill="#FFFFFF" opacity="0.45" transform="rotate(-30, -25, -30)"/>
  </g>

  <!-- Top Badges Overlay -->
  <g transform="translate(20, 24)">
    <rect width="84" height="26" rx="6" fill="#08478E" stroke="#FFC700" stroke-width="1"/>
    <text x="42" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">CLASSIC</text>
  </g>

  <g transform="translate(270, 24)">
    <rect width="98" height="26" rx="6" fill="#FFC700" />
    <text x="49" y="17" fill="#040F26" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">1.98X</text>
  </g>

  <!-- Bottom Dark Vignette for Text Contrast -->
  <rect y="380" width="388" height="168" fill="url(#coinBg)" opacity="0.95"/>

  <!-- Title "COIN FLIP" -->
  <g transform="translate(194, 460)">
    <text x="0" y="4" fill="#000000" font-family="system-ui, sans-serif" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3" opacity="0.8">COIN FLIP</text>
    <text x="0" y="0" fill="#FFC700" font-family="system-ui, sans-serif" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3" filter="url(#cGlow)">COIN FLIP</text>
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3">COIN FLIP</text>
  </g>

  <!-- Subtitle -->
  <text x="194" y="495" fill="#FF6B00" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2">BINARY ODDS 50/50</text>
  <text x="194" y="515" fill="#8EA8C7" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">HEAD OR TAIL • 1.98X INSTANT</text>
</svg>
