<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wheel_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#081329"/>
      <stop offset="100%" stop-color="#050b18"/>
    </linearGradient>
    <filter id="wheel_glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="20" fill="url(#wheel_bg)"/>

  <!-- Wheel Outer Ring -->
  <circle cx="200" cy="130" r="90" fill="#081329" stroke="#fc7219" stroke-width="6" filter="url(#wheel_glow)"/>

  <!-- Wheel Spokes & Multiplier badges -->
  <circle cx="200" cy="130" r="75" fill="#193e87" stroke="#ffffff" stroke-width="2"/>
  <circle cx="200" cy="130" r="45" fill="#0000F2"/>
  <circle cx="200" cy="130" r="20" fill="#fc7219"/>

  <!-- Center 50X text -->
  <text x="200" y="137" font-family="sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">50X</text>

  <!-- Pointer indicator -->
  <polygon points="200,28 190,48 210,48" fill="#fedbbb" stroke="#fc7219" stroke-width="2"/>

  <!-- Title Pill -->
  <rect x="80" y="235" width="240" height="42" rx="12" fill="#081329" stroke="#fedbbb" stroke-width="2"/>
  <text x="200" y="262" font-family="sans-serif" font-size="16" font-weight="900" fill="#fedbbb" text-anchor="middle" letter-spacing="2">CRAZY WHEEL</text>
</svg>
