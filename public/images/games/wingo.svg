<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="50%" stop-color="#193e87"/>
      <stop offset="100%" stop-color="#060814"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="100%" stop-color="#fc7219"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="300" rx="20" fill="url(#bg)"/>

  <!-- Color prediction balls -->
  <circle cx="120" cy="140" r="50" fill="#10b981" filter="url(#glow)" fill-opacity="0.9"/>
  <circle cx="200" cy="110" r="60" fill="#a855f7" filter="url(#glow)" fill-opacity="0.9"/>
  <circle cx="280" cy="140" r="50" fill="#f43f5e" filter="url(#glow)" fill-opacity="0.9"/>

  <!-- Ball labels -->
  <text x="120" y="148" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">7</text>
  <text x="200" y="120" font-family="sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
  <text x="280" y="148" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>

  <!-- Title Badge -->
  <rect x="90" y="220" width="220" height="42" rx="12" fill="#081329" stroke="url(#gold)" stroke-width="2"/>
  <text x="200" y="247" font-family="sans-serif" font-size="18" font-weight="900" fill="#fedbbb" text-anchor="middle" letter-spacing="2">WIN GO 30S</text>
</svg>
