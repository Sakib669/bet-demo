<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 548" width="100%" height="100%">
  <defs>
    <linearGradient id="minesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020713"/>
      <stop offset="40%" stop-color="#051738"/>
      <stop offset="80%" stop-color="#14061F"/>
      <stop offset="100%" stop-color="#03081A"/>
    </linearGradient>

    <!-- Mine Metallic Sphere -->
    <radialGradient id="mineSphere" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </radialGradient>

    <!-- Gem Gradient -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="388" height="548" fill="url(#minesBg)"/>

  <!-- Futuristic 5x5 Grid Cells in Background -->
  <g opacity="0.2" stroke="#3B82F6" stroke-width="1.5">
    <rect x="54" y="80" width="50" height="50" rx="8" fill="#08478E" />
    <rect x="114" y="80" width="50" height="50" rx="8" fill="#08478E" />
    <rect x="174" y="80" width="50" height="50" rx="8" fill="#08478E" />
    <rect x="234" y="80" width="50" height="50" rx="8" fill="#08478E" />
    <rect x="294" y="80" width="50" height="50" rx="8" fill="#08478E" />

    <rect x="54" y="140" width="50" height="50" rx="8" fill="#08478E" />
    <rect x="114" y="140" width="50" height="50" rx="8" fill="#08478E" />
    <rect x="174" y="140" width="50" height="50" rx="8" fill="#08478E" />
    <rect x="234" y="140" width="50" height="50" rx="8" fill="#08478E" />
    <rect x="294" y="140" width="50" height="50" rx="8" fill="#08478E" />

    <rect x="54" y="200" width="50" height="50" rx="8" fill="#08478E" />
    <rect x="114" y="200" width="50" height="50" rx="8" fill="#08478E" />
    <rect x="174" y="200" width="50" height="50" rx="8" fill="#08478E" />
    <rect x="234" y="200" width="50" height="50" rx="8" fill="#08478E" />
    <rect x="294" y="200" width="50" height="50" rx="8" fill="#08478E" />
  </g>

  <!-- Glowing Explosion Aura -->
  <circle cx="194" cy="230" r="130" fill="#EF4444" opacity="0.15" filter="url(#mGlow)"/>
  <circle cx="194" cy="230" r="70" fill="#FF6B00" opacity="0.2" filter="url(#mGlow)"/>

  <!-- Left Gem -->
  <g transform="translate(65, 210) rotate(-15)">
    <polygon points="25,0 45,15 35,45 15,45 5,15" fill="url(#gemGrad)" stroke="#00FFFF" stroke-width="1.5" filter="url(#mGlow)"/>
    <polygon points="25,0 35,15 15,15" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Right Gem -->
  <g transform="translate(290, 180) rotate(20)">
    <polygon points="30,0 55,18 42,52 18,52 6,18" fill="url(#gemGrad)" stroke="#00FFFF" stroke-width="1.5" filter="url(#mGlow)"/>
    <polygon points="30,0 42,18 18,18" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Central Spiked Mine -->
  <g transform="translate(194, 235)">
    <!-- Spikes radiating around mine -->
    <g fill="#1E293B" stroke="#475569" stroke-width="2">
      <!-- 8 Spikes -->
      <polygon points="-8,-60 8,-60 12,-78 -12,-78"/>
      <polygon points="-8,60 8,60 12,78 -12,78"/>
      <polygon points="-60,-8 -60,8 -78,12 -78,-12"/>
      <polygon points="60,-8 60,8 78,12 78,-12"/>

      <polygon points="-45,-45 -35,-35 -52,-52 -62,-42"/>
      <polygon points="45,-45 35,-35 52,-52 62,-42"/>
      <polygon points="-45,45 -35,35 -52,52 -62,42"/>
      <polygon points="45,45 35,35 52,52 62,42"/>
    </g>

    <!-- Main Mine Sphere -->
    <circle cx="0" cy="0" r="64" fill="url(#mineSphere)" stroke="#64748B" stroke-width="2.5"/>

    <!-- Mine Rivets -->
    <g fill="#94A3B8">
      <circle cx="0" cy="-42" r="3"/>
      <circle cx="0" cy="42" r="3"/>
      <circle cx="-42" cy="0" r="3"/>
      <circle cx="42" cy="0" r="3"/>
      <circle cx="-30" cy="-30" r="3"/>
      <circle cx="30" cy="-30" r="3"/>
      <circle cx="-30" cy="30" r="3"/>
      <circle cx="30" cy="30" r="3"/>
    </g>

    <!-- Center Glowing Red LED Sensor -->
    <circle cx="0" cy="0" r="16" fill="#EF4444" filter="url(#mGlow)"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    <!-- Warning Ring -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="#FF6B00" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Top Badges Overlay -->
  <g transform="translate(20, 24)">
    <rect width="84" height="26" rx="6" fill="#FF6B00" />
    <text x="42" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">MINES</text>
  </g>

  <g transform="translate(270, 24)">
    <rect width="98" height="26" rx="6" fill="#FFC700" />
    <text x="49" y="17" fill="#040F26" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">100X+</text>
  </g>

  <!-- Bottom Dark Vignette for Text Contrast -->
  <rect y="380" width="388" height="168" fill="url(#minesBg)" opacity="0.95"/>

  <!-- Title "MINES" -->
  <g transform="translate(194, 460)">
    <text x="0" y="4" fill="#000000" font-family="system-ui, sans-serif" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3" opacity="0.8">MINES 5X5</text>
    <text x="0" y="0" fill="#FF6B00" font-family="system-ui, sans-serif" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3" filter="url(#mGlow)">MINES 5X5</text>
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3">MINES 5X5</text>
  </g>

  <!-- Subtitle -->
  <text x="194" y="495" fill="#FFC700" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2">UNCOVER GEMS &amp; CASHOUT</text>
  <text x="194" y="515" fill="#8EA8C7" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">DYNAMIC CASHOUT • 1-24 MINES</text>
</svg>
