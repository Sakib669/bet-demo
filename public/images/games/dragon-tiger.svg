<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_dt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0714"/>
      <stop offset="50%" stop-color="#0e1f3d"/>
      <stop offset="100%" stop-color="#02142e"/>
    </linearGradient>
    <filter id="dt_glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="20" fill="url(#bg_dt)"/>

  <!-- Dragon Card -->
  <g transform="translate(90, 60) rotate(-6)">
    <rect width="90" height="135" rx="10" fill="#ffffff" stroke="#f43f5e" stroke-width="4" filter="url(#dt_glow)"/>
    <text x="18" y="32" font-family="sans-serif" font-size="22" font-weight="900" fill="#f43f5e">K</text>
    <text x="45" y="85" font-family="sans-serif" font-size="44" fill="#f43f5e" text-anchor="middle">♦</text>
  </g>

  <!-- VS Badge -->
  <circle cx="200" cy="130" r="26" fill="#fc7219" stroke="#ffffff" stroke-width="3" filter="url(#dt_glow)"/>
  <text x="200" y="137" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">VS</text>

  <!-- Tiger Card -->
  <g transform="translate(220, 60) rotate(6)">
    <rect width="90" height="135" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="4" filter="url(#dt_glow)"/>
    <text x="18" y="32" font-family="sans-serif" font-size="22" font-weight="900" fill="#3b82f6">Q</text>
    <text x="45" y="85" font-family="sans-serif" font-size="44" fill="#3b82f6" text-anchor="middle">♠</text>
  </g>

  <!-- Title Pill -->
  <rect x="80" y="225" width="240" height="42" rx="12" fill="#081329" stroke="#fc7219" stroke-width="2"/>
  <text x="200" y="252" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">DRAGON TIGER</text>
</svg>
