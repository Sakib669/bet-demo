<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 548" width="100%" height="100%">
  <defs>
    <linearGradient id="diceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="40%" stop-color="#051738"/>
      <stop offset="80%" stop-color="#1E0A3C"/>
      <stop offset="100%" stop-color="#080214"/>
    </linearGradient>

    <!-- Translucent Red Dice Gradient -->
    <linearGradient id="redDice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Gold Accent Dice Gradient -->
    <linearGradient id="goldDice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <filter id="dGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="388" height="548" fill="url(#diceBg)"/>

  <!-- Neon Glowing Ring & Spectrum Trail -->
  <circle cx="194" cy="230" r="130" fill="#E11D48" opacity="0.18" filter="url(#dGlow)"/>
  <circle cx="194" cy="230" r="80" fill="#FFC700" opacity="0.15" filter="url(#dGlow)"/>

  <!-- Slider Track Line Graphic in Background -->
  <g opacity="0.4" stroke="#00D2FF" stroke-width="2">
    <line x1="40" y1="310" x2="348" y2="310"/>
    <circle cx="194" cy="310" r="8" fill="#FF6B00"/>
    <circle cx="94" cy="310" r="4" fill="#00D2FF"/>
    <circle cx="294" cy="310" r="4" fill="#00D2FF"/>
  </g>

  <!-- Dice 1: Front Left Red Die (Isometric 3D) -->
  <g transform="translate(130, 200) rotate(15)">
    <!-- Die Top Face -->
    <polygon points="0,-40 45,-60 90,-40 45,-20" fill="#FF4D6D" stroke="#FFA3B1" stroke-width="1.5"/>
    <!-- Top Face Pips (Pip: 1 center) -->
    <ellipse cx="45" cy="-40" rx="6" ry="3.5" fill="#FFFFFF" filter="url(#dGlow)"/>

    <!-- Die Left Face -->
    <polygon points="0,-40 45,-20 45,35 0,15" fill="#E11D48" stroke="#FFA3B1" stroke-width="1.5"/>
    <!-- Left Face Pips (Pips: 2) -->
    <ellipse cx="20" cy="-10" rx="5" ry="4" fill="#FFFFFF"/>
    <ellipse cx="30" cy="15" rx="5" ry="4" fill="#FFFFFF"/>

    <!-- Die Right Face -->
    <polygon points="45,-20 90,-40 90,15 45,35" fill="#9F1239" stroke="#FFA3B1" stroke-width="1.5"/>
    <!-- Right Face Pips (Pips: 3) -->
    <ellipse cx="60" cy="-5" rx="5" ry="4" fill="#FFFFFF"/>
    <ellipse cx="68" cy="8" rx="5" ry="4" fill="#FFFFFF"/>
    <ellipse cx="76" cy="20" rx="5" ry="4" fill="#FFFFFF"/>
  </g>

  <!-- Dice 2: Back Right Gold Die (Isometric 3D) -->
  <g transform="translate(225, 170) rotate(-22)">
    <!-- Top Face -->
    <polygon points="0,-36 40,-54 80,-36 40,-18" fill="#FDE047" stroke="#FEF08A" stroke-width="1.5"/>
    <!-- Top Face Pips (Pips: 4) -->
    <ellipse cx="28" cy="-40" rx="4" ry="2.5" fill="#854D0E"/>
    <ellipse cx="52" cy="-40" rx="4" ry="2.5" fill="#854D0E"/>
    <ellipse cx="28" cy="-30" rx="4" ry="2.5" fill="#854D0E"/>
    <ellipse cx="52" cy="-30" rx="4" ry="2.5" fill="#854D0E"/>

    <!-- Left Face -->
    <polygon points="0,-36 40,-18 40,32 0,14" fill="#EAB308" stroke="#FEF08A" stroke-width="1.5"/>
    <!-- Right Face -->
    <polygon points="40,-18 80,-36 80,14 40,32" fill="#CA8A04" stroke="#FEF08A" stroke-width="1.5"/>
    <!-- Center Pips (5) -->
    <ellipse cx="50" cy="-5" rx="4" ry="3.5" fill="#854D0E"/>
    <ellipse cx="70" cy="-5" rx="4" ry="3.5" fill="#854D0E"/>
    <ellipse cx="60" cy="7" rx="4" ry="3.5" fill="#854D0E"/>
    <ellipse cx="50" cy="19" rx="4" ry="3.5" fill="#854D0E"/>
    <ellipse cx="70" cy="19" rx="4" ry="3.5" fill="#854D0E"/>
  </g>

  <!-- Top Badges Overlay -->
  <g transform="translate(20, 24)">
    <rect width="84" height="26" rx="6" fill="#3B82F6" />
    <text x="42" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">DICE</text>
  </g>

  <g transform="translate(270, 24)">
    <rect width="98" height="26" rx="6" fill="#FFC700" />
    <text x="49" y="17" fill="#040F26" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">49.50X</text>
  </g>

  <!-- Bottom Dark Vignette for Text Contrast -->
  <rect y="380" width="388" height="168" fill="url(#diceBg)" opacity="0.95"/>

  <!-- Title "DICE ROLL" -->
  <g transform="translate(194, 460)">
    <text x="0" y="4" fill="#000000" font-family="system-ui, sans-serif" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3" opacity="0.8">DICE ROLL</text>
    <text x="0" y="0" fill="#00D2FF" font-family="system-ui, sans-serif" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3" filter="url(#dGlow)">DICE ROLL</text>
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="3">DICE ROLL</text>
  </g>

  <!-- Subtitle -->
  <text x="194" y="495" fill="#FFC700" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2">OVER / UNDER SLIDER</text>
  <text x="194" y="515" fill="#8EA8C7" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">PRECISION TARGET • 99% RTP</text>
</svg>
