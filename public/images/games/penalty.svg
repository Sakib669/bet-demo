<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 548" width="100%" height="100%">
  <defs>
    <!-- Background Stadium Gradients -->
    <linearGradient id="stadiumSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="40%" stop-color="#06203D"/>
      <stop offset="75%" stop-color="#043224"/>
      <stop offset="100%" stop-color="#021C13"/>
    </linearGradient>

    <!-- Turf Grass Gradient -->
    <linearGradient id="turfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F5132"/>
      <stop offset="50%" stop-color="#0B3D26"/>
      <stop offset="100%" stop-color="#051F13"/>
    </linearGradient>

    <!-- Ball Gradient -->
    <radialGradient id="ballShine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="penGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="388" height="548" fill="url(#stadiumSky)"/>

  <!-- Stadium Floodlights -->
  <g opacity="0.6">
    <ellipse cx="60" cy="50" rx="30" ry="15" fill="#FFFFFF" filter="url(#penGlow)"/>
    <polygon points="60,50 -20,250 140,250" fill="#FFFFFF" opacity="0.08"/>
    <ellipse cx="328" cy="50" rx="30" ry="15" fill="#FFFFFF" filter="url(#penGlow)"/>
    <polygon points="328,50 248,250 408,250" fill="#FFFFFF" opacity="0.08"/>
  </g>

  <!-- Goal Net Grid Pattern (Perspective) -->
  <g opacity="0.25" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="30" y1="120" x2="358" y2="120"/>
    <line x1="20" y1="170" x2="368" y2="170"/>
    <line x1="10" y1="220" x2="378" y2="220"/>
    <line x1="0" y1="280" x2="388" y2="280"/>
    <!-- Vertical net strands -->
    <line x1="60" y1="100" x2="40" y2="300"/>
    <line x1="110" y1="100" x2="90" y2="300"/>
    <line x1="160" y1="100" x2="150" y2="300"/>
    <line x1="228" y1="100" x2="238" y2="300"/>
    <line x1="278" y1="100" x2="298" y2="300"/>
    <line x1="328" y1="100" x2="348" y2="300"/>
  </g>

  <!-- Goal Post Crossbar -->
  <rect x="25" y="110" width="338" height="12" rx="4" fill="#FFFFFF" filter="url(#penGlow)"/>
  <rect x="25" y="110" width="12" height="250" rx="4" fill="#E2E8F0"/>
  <rect x="351" y="110" width="12" height="250" rx="4" fill="#E2E8F0"/>

  <!-- Field Turf Base -->
  <path d="M 0 320 Q 194 300 388 320 L 388 548 L 0 548 Z" fill="url(#turfGrad)"/>

  <!-- Penalty Spot Line -->
  <ellipse cx="194" cy="380" rx="90" ry="18" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>
  <circle cx="194" cy="380" r="6" fill="#FFFFFF" opacity="0.8"/>

  <!-- Goalkeeper Silhouette Diving -->
  <g transform="translate(110, 160) rotate(-18)" opacity="0.75">
    <ellipse cx="50" cy="40" rx="14" ry="14" fill="#F59E0B" filter="url(#penGlow)"/> <!-- Head -->
    <path d="M 36 50 L 64 50 L 58 110 L 42 110 Z" fill="#2563EB"/> <!-- Jersey -->
    <!-- Extended arms with gloves -->
    <line x1="40" y1="55" x2="-5" y2="25" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-5" cy="25" r="10" fill="#EF4444"/> <!-- Glove -->
    <line x1="60" y1="55" x2="105" y2="25" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <circle cx="105" cy="25" r="10" fill="#EF4444"/>
  </g>

  <!-- Dynamic 3D Soccer Ball Bursting Forward -->
  <g transform="translate(194, 235)">
    <!-- Ball Motion Speed Trails -->
    <g stroke="#00D2FF" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#penGlow)">
      <line x1="-80" y1="60" x2="-40" y2="25"/>
      <line x1="-70" y1="-50" x2="-35" y2="-20"/>
      <line x1="70" y1="60" x2="35" y2="25"/>
      <line x1="80" y1="-50" x2="40" y2="-20"/>
    </g>

    <!-- Shockwave ring -->
    <ellipse cx="0" cy="0" rx="85" ry="85" fill="none" stroke="#FFC700" stroke-width="3" opacity="0.6" filter="url(#penGlow)"/>

    <!-- The 3D Ball -->
    <circle cx="0" cy="0" r="62" fill="url(#ballShine)" stroke="#0F172A" stroke-width="2"/>

    <!-- Black Pentagons -->
    <polygon points="0,-22 -20,-8 -12,16 12,16 20,-8" fill="#0F172A"/>
    <!-- Outer pentagons on curve -->
    <polygon points="-38,-42 -22,-36 -28,-18 -48,-15 -55,-30" fill="#0F172A"/>
    <polygon points="38,-42 22,-36 28,-18 48,-15 55,-30" fill="#0F172A"/>
    <polygon points="-30,35 -14,24 -18,48 -35,52 -45,40" fill="#0F172A"/>
    <polygon points="30,35 14,24 18,48 35,52 45,40" fill="#0F172A"/>
    <polygon points="0,-58 -10,-48 10,-48" fill="#0F172A"/>

    <!-- Ball Seams -->
    <path d="M 0 -22 L 0 -48 M -20 -8 L -28 -18 M 20 -8 L 28 -18 M -12 16 L -14 24 M 12 16 L 14 24" stroke="#64748B" stroke-width="2.5"/>

    <!-- Ball Gloss highlight -->
    <ellipse cx="-20" cy="-22" rx="20" ry="10" fill="#FFFFFF" opacity="0.6" transform="rotate(-30, -20, -22)"/>
  </g>

  <!-- Top Badges Overlay -->
  <g transform="translate(20, 24)">
    <rect width="84" height="26" rx="6" fill="#10B981" />
    <text x="42" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">SPORTS</text>
  </g>

  <g transform="translate(270, 24)">
    <rect width="98" height="26" rx="6" fill="#FFC700" />
    <text x="49" y="17" fill="#040F26" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">30.72X</text>
  </g>

  <!-- Bottom Dark Vignette for Text Contrast -->
  <rect y="380" width="388" height="168" fill="url(#stadiumSky)" opacity="0.95"/>

  <!-- Title "PENALTY" -->
  <g transform="translate(194, 460)">
    <text x="0" y="4" fill="#000000" font-family="system-ui, sans-serif" font-size="42" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="2" opacity="0.8">PENALTY</text>
    <text x="0" y="0" fill="#10B981" font-family="system-ui, sans-serif" font-size="42" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="2" filter="url(#penGlow)">PENALTY</text>
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="42" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="2">PENALTY</text>
  </g>

  <!-- Subtitle -->
  <text x="194" y="495" fill="#FFC700" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2">SHOOT-OUT STADIUM</text>
  <text x="194" y="515" fill="#8EA8C7" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">5 GOALS PROGRESSIVE • 30.72x</text>
</svg>
